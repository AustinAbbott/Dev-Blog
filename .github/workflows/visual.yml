name: Visual

on:
  push:
    branches:
      - master
  pull_request:

# TEMPORARY (one-off baseline refresh for the Playwright 1.65 bump). Revert before merge.
permissions:
  contents: write

jobs:
  visual:
    name: Visual snapshot tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Regenerate snapshots (temporary)
        run: npm run test:visual:update

      - name: Commit regenerated snapshots (temporary)
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git add -- tests/
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visual): update snapshots for Playwright 1.65"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
